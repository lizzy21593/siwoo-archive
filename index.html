<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SIWOO ARCHIVE</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #eee8f2;
    color: #3f3545;
    font-family: Georgia, "Times New Roman", serif;
}

.archive {
    max-width: 1100px;
    margin: 0 auto;
    padding: 70px 30px 90px;
}

/* HEADER */

.header {
    text-align: center;
    margin-bottom: 70px;
}

.header h1 {
    margin: 0;
    font-size: 38px;
    font-weight: normal;
    letter-spacing: 7px;
}

.header p {
    margin: 14px 0 0;
    font-size: 11px;
    letter-spacing: 4px;
    color: #806a91;
}

/* ARCHIVE CARD */

.archive-item {
    display: block;
    text-decoration: none;
    color: inherit;
    margin: 0 auto;
    max-width: 760px;
}

.cover {
    background: #ffffff;
    padding: 18px;
    box-shadow: 0 10px 30px rgba(70, 50, 80, 0.10);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.cover:hover {
    transform: translateY(-5px);
    box-shadow: 0 16px 35px rgba(70, 50, 80, 0.16);
}

.cover img {
    display: block;
    width: 100%;
    height: auto;
}

.info {
    text-align: center;
    padding: 28px 10px 5px;
}

.info .category {
    font-size: 10px;
    letter-spacing: 3px;
    color: #806a91;
    margin-bottom: 12px;
}

.info h2 {
    margin: 0;
    font-size: 22px;
    font-weight: normal;
    letter-spacing: 2px;
}

.info .subtitle {
    margin-top: 10px;
    font-size: 11px;
    letter-spacing: 2px;
    color: #8d8392;
}

/* MOBILE */

@media (max-width: 600px) {

    .archive {
        padding: 45px 18px 60px;
    }

    .header {
        margin-bottom: 45px;
    }

    .header h1 {
        font-size: 27px;
        letter-spacing: 5px;
    }

    .header p {
        font-size: 9px;
        letter-spacing: 2px;
    }

    .cover {
        padding: 10px;
    }

    .info h2 {
        font-size: 18px;
    }
}
</style>
</head>

<body>

<div class="archive">

    <header class="header">
        <h1>SIWOO ARCHIVE</h1>
        <p>SELECTED WORKS · INTERVIEWS · MAGAZINES</p>
    </header>

    <a class="archive-item" href="./marie-claire/">

        <div class="cover">
            <img src="./marie-claire/page4.jpg" alt="Marie Claire Korea · Siwoo">
        </div>

        <div class="info">
            <div class="category">
                MARIE CLAIRE KOREA
            </div>

            <h2>INTERVIEW</h2>

            <div class="subtitle">
                SIWOO · KOREA MAGAZINE
            </div>
        </div>

    </a>

</div>

</body>
</html>
